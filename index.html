<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои таблетки</title>
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Таблетки">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --text: #141414;
    --muted: #5a5a5a;
    --line: #dedad2;
    --accent: #1f6f4a;
    --accent-soft: #e2f1e8;
    --accent-text: #ffffff;
    --warn: #b34700;
    --warn-soft: #fdeee2;
    --danger: #b3261e;
    --danger-soft: #fbe5e3;
    --focus: #1a5fd0;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
    --radius: 1.1rem;
    font-size: 20px;
  }
  :root[data-theme="dark"] {
    --bg: #121212;
    --card: #1f1f1f;
    --text: #f5f5f5;
    --muted: #b8b8b8;
    --line: #383838;
    --accent: #5fd39b;
    --accent-soft: #173727;
    --accent-text: #0b1f15;
    --warn: #ffab6b;
    --warn-soft: #3a2414;
    --danger: #ff8a80;
    --danger-soft: #3d1a18;
    --focus: #8ab4ff;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .wrap {
    max-width: 40rem;
    margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(2rem + env(safe-area-inset-bottom));
  }

  /* Шапка */
  .top { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: .75rem; }
  .tools { display: flex; gap: .4rem; }
  .icon-btn {
    min-width: 2.6rem; height: 2.6rem; padding: 0 .6rem;
    border-radius: .8rem; border: 2px solid var(--line); background: var(--card);
    font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { transform: scale(.96); }
  .icon-btn svg { width: 1.3rem; height: 1.3rem; }
  .status { font-size: .8rem; color: var(--warn); font-weight: 600; }

  .day { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin: .5rem 0 1rem; }
  .day h1 { margin: 0; min-width: 0; overflow-wrap: break-word; font-size: min(1.6rem, 36px); line-height: 1.15; text-align: center; flex: 1; }
  .day .sub { display: block; font-size: .9rem; font-weight: 500; color: var(--muted); margin-top: .2rem; }
  .day .icon-btn { flex: none; width: min(2.8rem, 56px); height: min(2.8rem, 56px); min-width: 0; padding: 0; border-radius: 50%; }
  .day .icon-btn[disabled] { opacity: .3; cursor: default; }
  .back-today {
    display: block; margin: -.5rem auto 1rem; padding: .4rem 1rem;
    border-radius: 2rem; border: none; background: var(--accent-soft); color: var(--text); font-weight: 600; font-size: .9rem;
  }

  /* Прогресс */
  .progress { background: var(--card); border-radius: var(--radius); padding: .9rem 1.1rem; box-shadow: var(--shadow); margin-bottom: 1.25rem; }
  .progress-row { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; }
  .progress-row b { font-size: 1.25rem; }
  .bar { height: .6rem; border-radius: 1rem; background: var(--line); margin-top: .6rem; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 1rem; transition: width .3s; }

  /* Карточки приёма */
  .group-title { font-size: 1.05rem; font-weight: 700; color: var(--muted); margin: 1.25rem .25rem .5rem; }
  .dose {
    width: 100%; display: flex; align-items: center; gap: 1rem;
    background: var(--card); border: 2px solid transparent; border-radius: var(--radius);
    padding: min(1rem, 22px) min(1.1rem, 22px); margin-bottom: .7rem; text-align: left; box-shadow: var(--shadow);
    transition: background .2s, border-color .2s;
  }
  .dose:active { transform: scale(.99); }
  .dose .info { flex: 1; min-width: 0; }
  .dose .name { font-size: 1.25rem; font-weight: 700; line-height: 1.2; overflow-wrap: break-word; hyphens: auto; }
  .dose .meta { color: var(--muted); margin-top: .2rem; overflow-wrap: break-word; hyphens: auto; }
  .dose .state { font-weight: 600; margin-top: .3rem; font-size: .95rem; }
  .check {
    flex: none; width: min(3.2rem, 76px); height: min(3.2rem, 76px); border-radius: 50%;
    border: 3px solid var(--line); display: flex; align-items: center; justify-content: center;
  }
  .check svg { width: 60%; height: 60%; opacity: 0; }
  .dose.taken { background: var(--accent-soft); border-color: var(--accent); box-shadow: none; }
  .dose.taken .check { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .dose.taken .check svg { opacity: 1; }
  .dose.taken .state { color: var(--accent); }
  :root[data-theme="dark"] .dose.taken .state { color: var(--accent); }
  .dose.late { border-color: var(--warn); }
  .dose.late .state { color: var(--warn); }
  .dose.late .check { border-color: var(--warn); }

  .empty { text-align: center; padding: 2.5rem 1rem; color: var(--muted); }
  .empty p { margin: 0 0 1.25rem; font-size: 1.1rem; }

  /* Кнопки */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
    min-height: 3.2rem; padding: .7rem 1.4rem; border-radius: 1rem; border: none;
    font-weight: 700; font-size: 1.05rem;
  }
  .btn-primary { background: var(--accent); color: var(--accent-text); }
  .btn-ghost { background: var(--card); border: 2px solid var(--line); }
  .btn-danger { background: transparent; color: var(--danger); border: 2px solid currentColor; }
  .btn-block { width: 100%; }
  .manage { margin-top: 1.75rem; }

  /* Экран управления */
  .screen-head { display: flex; align-items: center; gap: .75rem; margin-bottom: 1.25rem; }
  .screen-head h1 { margin: 0; font-size: min(1.5rem, 34px); flex: 1; min-width: 0; overflow-wrap: break-word; }
  .pill-row {
    width: 100%; display: flex; align-items: center; gap: .75rem; text-align: left;
    background: var(--card); border: 2px solid transparent; border-radius: var(--radius);
    padding: 1rem 1.1rem; margin-bottom: .7rem; box-shadow: var(--shadow);
  }
  .pill-row .info { flex: 1; min-width: 0; }
  .pill-row .chev { color: var(--muted); font-size: 1.5rem; }

  /* Форма */
  label.f { display: block; font-weight: 700; margin: 1.1rem 0 .4rem; }
  .hint { font-weight: 400; color: var(--muted); font-size: .9rem; }
  input.in {
    width: 100%; min-height: 3.2rem; padding: .6rem .9rem;
    border: 2px solid var(--line); border-radius: .9rem; background: var(--card);
    font-size: 1.1rem;
  }
  input.in:focus { border-color: var(--focus); outline: none; }
  .times { display: flex; flex-direction: column; gap: .5rem; }
  .time-row { display: flex; gap: .5rem; }
  .time-row input { flex: 1; }
  .time-row .icon-btn { height: 3.2rem; min-width: 3.2rem; color: var(--danger); }
  .presets { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .6rem; }
  .chip { padding: .45rem .9rem; border-radius: 2rem; border: 2px solid var(--line); background: var(--card); font-weight: 600; font-size: .95rem; }
  .form-actions { display: flex; flex-direction: column; gap: .6rem; margin-top: 1.75rem; }
  .error { color: var(--danger); font-weight: 600; margin-top: .5rem; min-height: 1.4em; }

  /* Диалог */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; padding: 1rem; z-index: 10; }
  .modal[hidden] { display: none; }
  .sheet { background: var(--card); border-radius: 1.4rem; padding: 1.4rem; width: 100%; max-width: 32rem; margin-bottom: env(safe-area-inset-bottom); }
  .sheet h2 { margin: 0 0 .5rem; font-size: 1.35rem; }
  .sheet p { margin: 0 0 1.25rem; color: var(--muted); }
  .sheet .form-actions { margin-top: 0; }
  @media (min-width: 640px) { .modal { align-items: center; } }

  /* Шрифт */
  .font-panel { background: var(--card); border-radius: var(--radius); padding: 1rem 1.1rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
  .font-panel[hidden] { display: none; }
  .font-row { display: flex; align-items: center; gap: .6rem; }
  .font-row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); height: 2.4rem; }
  .font-row .small { font-size: 14px; font-weight: 700; }
  .font-row .big { font-size: 30px; font-weight: 700; }
  .font-panel .panel-title { font-weight: 700; margin-bottom: .4rem; display: flex; justify-content: space-between; }
  .theme-switch { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .9rem; }
  .theme-switch button { flex: 1 1 auto; padding: 0 .6rem; min-height: 2.8rem; border-radius: .8rem; border: 2px solid var(--line); background: var(--bg); font-weight: 600; }
  .theme-switch button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

  /* Календарь */
  .cal { background: var(--card); border-radius: var(--radius); padding: .75rem .5rem; box-shadow: var(--shadow); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-head { margin-bottom: .4rem; text-align: center; color: var(--muted); font-weight: 700; font-size: min(.8rem, 17px); }
  .cal-cell {
    aspect-ratio: 1; min-width: 0; border-radius: .7rem; border: 2px solid transparent; background: transparent;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0;
    font-weight: 700; font-size: min(1rem, 21px); line-height: 1.1;
  }
  .cal-cell.blank { visibility: hidden; }
  .cal-cell[disabled] { color: var(--muted); opacity: .45; cursor: default; }
  .cal-cell .mark { font-size: .75em; min-height: 1.1em; }
  .cal-cell.full { background: var(--accent); color: var(--accent-text); }
  .cal-cell.part { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
  .cal-cell.miss { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
  .cal-cell.is-today { outline: 3px solid var(--text); outline-offset: 1px; }
  .cal-summary { text-align: center; font-size: 1.05rem; margin: 1rem 0 .5rem; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem 1.1rem; margin-top: .75rem; font-weight: 600; font-size: .95rem; }
  .legend span { display: inline-flex; align-items: center; gap: .4rem; }
  .legend .cal-cell { width: 1.7rem; height: 1.7rem; aspect-ratio: auto; border-radius: .45rem; font-style: normal; font-size: .9rem; }
  .bottom-btns { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
  @media (max-width: 380px) { .bottom-btns { grid-template-columns: 1fr; } }

  /* Напоминания */
  .panel { background: var(--card); border-radius: var(--radius); padding: 1rem 1.1rem; box-shadow: var(--shadow); margin-bottom: 1rem; }
  .panel p { margin: 0 0 .9rem; }
  .panel .form-actions { margin-top: .9rem; }
  .section-title { font-size: 1.15rem; margin: 1.5rem .25rem .6rem; }
  .steps { margin: 0 0 .5rem; padding-left: 1.4rem; }
  .steps li { margin-bottom: .5rem; }
  .diag { font-size: min(.75rem, 15px); margin: 1rem 0 0 !important; overflow-wrap: anywhere; }
  .ok-line { color: var(--accent); font-weight: 700; }
  .code-box { display: flex; flex-direction: column; align-items: center; gap: .2rem; padding: .8rem; border-radius: .9rem; background: var(--bg); }
  .code-box b { font-size: min(1.5rem, 32px); letter-spacing: .08em; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; overflow-wrap: anywhere; text-align: center; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title"></h2>
    <p id="modal-text"></p>
    <div class="form-actions">
      <button class="btn btn-primary btn-block" id="modal-ok"></button>
      <button class="btn btn-ghost btn-block" id="modal-cancel">Отмена</button>
    </div>
  </div>
</div>

<script>window.PILLS_API = "https://tabletki-api.kotoryy.ru";</script>
<script>
(() => {
  const FONT_STEPS = [16, 18, 20, 23, 26, 30, 34];
  const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const WEEKDAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  let data = { pills: [], log: {} };
  let online = true;
  let view = 'today';          // 'today' | 'manage' | 'edit'
  let editing = null;          // редактируемая таблетка
  let offset = 0;              // смещение дня относительно сегодня
  let calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1); // месяц в календаре
  let showFont = false;
  let fontIdx = store.get('fontIdx', 3);
  let theme = store.get('theme', 'auto');

  const app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const dayDate = () => { const d = new Date(); d.setDate(d.getDate() + offset); return d; };

  // ---------- Настройки отображения ----------
  function applyFont() {
    fontIdx = Math.max(0, Math.min(FONT_STEPS.length - 1, fontIdx));
    document.documentElement.style.fontSize = FONT_STEPS[fontIdx] + 'px';
    store.set('fontIdx', fontIdx);
  }
  function applyTheme() {
    const dark = theme === 'dark' || (theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    store.set('theme', theme);
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

  // ---------- Облачный режим (версия на сайте): общий список семьи на сервере ----------
  // Изменения сразу применяются на устройстве, копятся в очереди и отправляются, когда есть интернет.
  const API = window.PILLS_API || '';
  const CLOUD = !!API;
  const CACHE_KEY = 'pills-data', QUEUE_KEY = 'pills-queue', HKEY = 'pills-key', SYNCED_KEY = 'pills-synced';
  const TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch { return ''; } })();
  const cleanTimes = times => [...new Set((times || []).filter(t => /^\d{2}:\d{2}$/.test(t)))].sort();
  let hkey = store.get(HKEY, '');
  let queue = store.get(QUEUE_KEY, []);
  // До какой версии сервера на устройстве уже есть весь журнал: тогда сервер присылает только изменения
  let synced = store.get(SYNCED_KEY, null);
  let syncing = null;

  // То же самое делает сервер с каждой операцией
  function applyOp(s, op) {
    if (op.type === 'pill') {
      const p = op.pill;
      const pill = { id: p.id, name: String(p.name || '').trim().slice(0, 80), dose: String(p.dose || '').trim().slice(0, 80),
        note: String(p.note || '').trim().slice(0, 200), times: cleanTimes(p.times) };
      if (!pill.times.length) pill.times = ['09:00'];
      const i = s.pills.findIndex(x => x.id === pill.id);
      const created = /^\d{4}-\d{2}-\d{2}$/.test(p.created || '') ? p.created : s.pills[i]?.created;
      if (created) pill.created = created;
      if (i >= 0) s.pills[i] = pill; else s.pills.push(pill);
    } else if (op.type === 'del') {
      s.pills = s.pills.filter(x => x.id !== op.id);
    } else if (op.type === 'mark') {
      const key = `${op.pillId}@${op.time}`;
      const day = s.log[op.date] || (s.log[op.date] = {});
      if (op.at) day[key] = op.at; else delete day[key];
      if (!Object.keys(day).length) delete s.log[op.date];
    }
  }

  function showData(d) {
    data = d;
    store.set(CACHE_KEY, d);
    if (view !== 'edit') render();
  }

  async function cloudFetch(path, body) {
    const r = await fetch(API + path, body === undefined ? { cache: 'no-store' }
      : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.error || 'Ошибка'); e.status = r.status; throw e; }
    return j;
  }

  // Ответы сервера маленькие (без VPN в России связь с Cloudflare рвётся после ~16 КБ):
  // журнал приходит частями от свежих дней к старым, а при обычной синхронизации — только изменённые дни.
  async function pull(key, first) {
    const s = first.since ? structuredClone(data) : { log: {} };
    let page = first;
    for (;;) {
      for (const [date, day] of Object.entries(page.log)) {
        if (Object.keys(day).length) s.log[date] = day; else delete s.log[date];
      }
      if (!page.more) break;
      page = await cloudFetch(`/h/${key}?v=${first.since}&before=${page.more}`);
    }
    s.pills = first.pills;
    s.version = first.version;
    return s;
  }

  // Отправить очередь и получить свежий общий список
  function sync() {
    if (!CLOUD) return Promise.resolve();
    if (syncing) return syncing;
    syncing = (async () => {
      try {
        if (!hkey) {
          // Первый запуск: создаём общий список из того, что уже есть на устройстве
          const r = await cloudFetch('/h', { data: store.get(CACHE_KEY, data), tz: TZ });
          hkey = r.key; store.set(HKEY, hkey);
          queue = []; store.set(QUEUE_KEY, queue);
          synced = null; store.set(SYNCED_KEY, synced);
          showData(await pull(hkey, r.state));
          synced = { key: hkey, v: r.state.version }; store.set(SYNCED_KEY, synced);
        } else {
          const key = hkey;
          const v = synced?.key === key ? synced.v : 0;
          let first;
          while (queue.length && hkey === key) { // по 50 операций, чтобы и запросы были небольшими
            const sent = queue.slice(0, 50);
            first = await cloudFetch(`/h/${key}/ops`, { ops: sent, tz: TZ, v });
            queue = queue.slice(sent.length); store.set(QUEUE_KEY, queue);
          }
          if (!first) first = await cloudFetch(`/h/${key}?v=${v}`);
          const s = await pull(key, first);
          if (hkey !== key) return; // пока шёл ответ, подключили другой список
          for (const op of queue) applyOp(s, op); // то, что добавилось во время отправки
          showData(s);
          synced = { key, v: first.version }; store.set(SYNCED_KEY, synced);
        }
        setOnline(true);
      } catch (e) {
        setOnline(false);
      } finally {
        syncing = null;
      }
    })();
    return syncing;
  }

  function cloudApi(method, url, body) {
    let op;
    if (url === '/api/pills' && method === 'POST') op = { type: 'pill', pill: body };
    else if (url.startsWith('/api/pills/') && method === 'DELETE') op = { type: 'del', id: decodeURIComponent(url.slice('/api/pills/'.length)) };
    else if (url === '/api/toggle') {
      const already = (data.log[body.date] || {})[`${body.pillId}@${body.time}`];
      op = { type: 'mark', date: body.date, pillId: body.pillId, time: body.time, at: already ? null : body.at };
    } else { sync(); return data; }
    const s = structuredClone(data);
    applyOp(s, op);
    queue.push(op); store.set(QUEUE_KEY, queue);
    showData(s);
    sync();
    return s;
  }

  // Подключить устройство к общему списку по коду
  async function join(code) {
    code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 12) throw new Error('Код состоит из 12 букв и цифр');
    code = `${code.slice(0, 4)}-${code.slice(4, 8)}-${code.slice(8)}`;
    if (code === hkey) return;
    const s = await cloudFetch(`/h/${code}`).catch(e => { throw new Error(e.status === 404 ? 'Такой код не найден' : 'Нет связи с интернетом'); });
    hkey = code; store.set(HKEY, hkey);
    queue = []; store.set(QUEUE_KEY, queue);
    synced = null; store.set(SYNCED_KEY, synced);
    showData({ pills: s.pills, log: s.log, version: s.version }); // свежие дни сразу, остальная история — следом
    sync();
    if (pushState === 'on') await enablePush().catch(() => {}); // напоминания теперь для нового списка
  }

  if (CLOUD) {
    data = store.get(CACHE_KEY, data);
    try { navigator.storage?.persist?.(); } catch {}
    addEventListener('online', () => sync());
    setInterval(() => { if (!document.hidden) sync(); }, 15000);
  }

  // ---------- Напоминания (Web Push) ----------
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  let pushState = 'unknown'; // unknown | needs-install | unsupported | denied | off | on
  let pushDebug = ''; // последний ответ системы — для поиска проблем
  const diag = () => {
    const ios = (navigator.userAgent.match(/OS (d+)_(d+)/) || []).slice(1).join('.');
    const perm = 'Notification' in window ? Notification.permission : 'нет';
    return `iOS ${ios || '—'} · с экрана Домой: ${standalone ? 'да' : 'нет'} · разрешение: ${perm} · Push: ${'PushManager' in window ? 'есть' : 'нет'} · SW: ${navigator.serviceWorker?.controller ? 'да' : 'нет'}${pushDebug ? ' · ' + pushDebug : ''}`;
  };

  async function checkPush() {
    if (!CLOUD) return;
    let st;
    if (isIOS && !standalone) st = 'needs-install';
    else if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) st = 'unsupported';
    else if (Notification.permission === 'denied') st = 'denied';
    else {
      const reg = await navigator.serviceWorker.ready;
      st = (await reg.pushManager.getSubscription()) && Notification.permission === 'granted' ? 'on' : 'off';
    }
    if (st !== pushState) { pushState = st; if (view === 'remind') render(); }
  }

  async function enablePush() {
    let perm;
    try { perm = await Notification.requestPermission(); }
    catch (e) { pushDebug = 'запрос: ' + e.message; throw new Error('iPhone не показал запрос разрешения'); }
    pushDebug = 'ответ на запрос: ' + perm;
    if (perm !== 'granted') { await checkPush(); throw new Error(perm === 'denied' ? 'denied' : 'Разрешение не выдано'); }
    if (!hkey) await sync();
    if (!hkey) throw new Error('Нет связи с интернетом');
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const { key } = await cloudFetch('/vapid');
      try { sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) }); }
      catch (e) { pushDebug = 'подписка: ' + e.name + ' ' + e.message; throw new Error('Не удалось подписаться на уведомления'); }
    }
    await cloudFetch(`/h/${hkey}/subscribe`, { sub: sub.toJSON(), tz: TZ });
    pushState = 'on';
  }

  async function disablePush() {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      await cloudFetch(`/h/${hkey}/unsubscribe`, { endpoint: sub.endpoint }).catch(() => {});
      await sub.unsubscribe();
    }
    pushState = 'off';
  }

  async function testPush() {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (!sub) throw new Error('Напоминания не включены');
    const r = await cloudFetch(`/h/${hkey}/test`, { endpoint: sub.endpoint });
    if (!r.ok) throw new Error('Сервис уведомлений не принял сообщение');
  }

  function b64ToBytes(s) {
    const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4));
    return Uint8Array.from(bin, c => c.charCodeAt(0));
  }

  // ---------- Связь с сервером ----------
  async function api(method, url, body) {
    if (CLOUD) return cloudApi(method, url, body);
    try {
      const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'Ошибка');
      setData(j);
      setOnline(true);
      return j;
    } catch (e) {
      setOnline(false);
      throw e;
    }
  }
  function setData(d) {
    if (d.version !== undefined && data.version !== undefined && d.version < data.version) return;
    data = d;
    if (view !== 'edit') render();
  }
  function setOnline(v) {
    if (online === v) return;
    online = v;
    const el = document.getElementById('status');
    if (el) el.hidden = v;
  }
  function connect() {
    if (CLOUD) return;
    const es = new EventSource('/api/events');
    es.onmessage = e => { setOnline(true); setData(JSON.parse(e.data)); };
    es.onerror = () => { setOnline(false); };
  }
  // Safari может «усыплять» вкладку — при возврате обновляем данные
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (CLOUD) { sync(); checkPush(); } else api('GET', '/api/state').catch(() => {});
  });

  // ---------- Диалог подтверждения ----------
  function confirmBox(title, text, okText) {
    return new Promise(resolve => {
      const m = document.getElementById('modal');
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-text').textContent = text;
      const ok = document.getElementById('modal-ok');
      const cancel = document.getElementById('modal-cancel');
      ok.textContent = okText;
      m.hidden = false;
      ok.focus();
      const done = v => { m.hidden = true; ok.onclick = cancel.onclick = m.onclick = null; resolve(v); };
      ok.onclick = () => done(true);
      cancel.onclick = () => done(false);
      m.onclick = e => { if (e.target === m) done(false); };
    });
  }

  // ---------- Экраны ----------
  function fontPanel() {

  const BACK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';

          <div class="form-actions">

        <form id="join-form" autocomplete="off">

          <div class="form-actions"><button type="submit" class="btn btn-ghost btn-block">Подключиться</button></div>
        </form>
      </section>`;
  }

  async function remindAction(fn) {
    remindMsg = ''; remindOk = false;
    try { await fn(); }
    catch (e) {
      remindMsg = e.message === 'denied' ? 'iPhone ответил: уведомления запрещены' : e.message === 'Failed to fetch' ? 'Нет связи с интернетом' : e.message;
      await checkPush();
    }
    render();
  }

  // Приёмы на дату: только лекарства, которые уже были добавлены к этому дню
  function dosesFor(date) {
    const log = data.log[date] || {};
    const doses = [];
    for (const p of data.pills) {
      if (p.created && p.created > date) continue;
      for (const t of p.times) doses.push({ p, t, at: log[`${p.id}@${t}`] });
    }
    return doses.sort((a, b) => a.t.localeCompare(b.t) || a.p.name.localeCompare(b.p.name, 'ru'));
  }

  // С какого дня ведётся учёт: первая отметка или первое добавленное лекарство
  function trackStart() {
    const dates = [...Object.keys(data.log), ...data.pills.map(p => p.created).filter(Boolean)];
    return dates.length ? dates.sort()[0] : null;
  }

  // Итог дня для календаря: full | part | miss | pending | null
  function dayStatus(date, today, start) {
    if (date > today || !start || date < start) return null;
    const doses = dosesFor(date);
    if (!doses.length) return null;
    const taken = doses.filter(x => x.at).length;
    if (taken === doses.length) return 'full';
    if (date === today) return 'pending';
    return taken ? 'part' : 'miss';
  }

  const MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const STATUS_MARK = { full: '✓', part: '◐', miss: '✕', pending: '' };
  const STATUS_TEXT = { full: 'всё принято', part: 'принято частично', miss: 'пропущено', pending: 'сегодня, ещё не всё принято' };

  function renderCalendar() {
    const today = isoDate(new Date());
    const start = trackStart();
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    const now = new Date();
    const isCurrent = y === now.getFullYear() && m === now.getMonth();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const lead = (new Date(y, m, 1).getDay() + 6) % 7; // понедельник — первый день недели

    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<span class="cal-cell blank" aria-hidden="true"></span>';
    const counts = { full: 0, part: 0, miss: 0 };
    for (let dnum = 1; dnum <= daysInMonth; dnum++) {
      const date = `${y}-${pad(m + 1)}-${pad(dnum)}`;
      const st = dayStatus(date, today, start);
      if (counts[st] !== undefined) counts[st]++;
      const future = date > today;
      const label = `${dnum} ${MONTHS[m]}${st ? ', ' + STATUS_TEXT[st] : ''}`;
      cells += `
        <button class="cal-cell ${st || ''} ${date === today ? 'is-today' : ''}" data-day="${date}" ${future ? 'disabled' : ''} aria-label="${label}">
          <span class="num">${dnum}</span><span class="mark" aria-hidden="true">${st ? STATUS_MARK[st] : ''}</span>
        </button>`;
    }
    const tracked = counts.full + counts.part + counts.miss;

    app.innerHTML = topBar() + `
      <div class="screen-head">
        <button class="icon-btn" data-act="back" aria-label="Назад">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h1>Календарь</h1>

        </button>
        <h1>${MONTHS_NOM[m]}<span class="sub">${y}</span></h1>
        <button class="icon-btn" data-act="cal-next" aria-label="Следующий месяц" ${isCurrent ? 'disabled' : ''}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div class="cal">
        <div class="cal-grid cal-head" aria-hidden="true"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
        <div class="cal-grid">${cells}</div>
      </div>
      ${tracked ? `<p class="cal-summary">Всё принято в <b>${counts.full}</b> из <b>${tracked}</b> ${plural(tracked, 'дня', 'дней', 'дней')}</p>` : ''}
      <div class="legend">
        <span><i class="cal-cell full"><span class="mark">✓</span></i>Всё принято</span>
        <span><i class="cal-cell part"><span class="mark">◐</span></i>Частично</span>
        <span><i class="cal-cell miss"><span class="mark">✕</span></i>Пропущено</span>
      </div>
      <p class="hint" style="text-align:center;margin-top:1rem">Нажмите на день, чтобы посмотреть подробно</p>`;
  }
  const plural = (n, one, few, many) => {
    const n10 = n % 10, n100 = n % 100;
    return n10 === 1 && n100 !== 11 ? one : n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14) ? few : many;
  };

  function renderToday() {
    const d = dayDate();
    const date = isoDate(d);
    const isToday = offset === 0;
    const label = isToday ? 'Сегодня' : offset === -1 ? 'Вчера' : offset === 1 ? 'Завтра' : WEEKDAYS[d.getDay()][0].toUpperCase() + WEEKDAYS[d.getDay()].slice(1);
    const sub = `${d.getDate()} ${MONTHS[d.getMonth()]}${isToday || Math.abs(offset) === 1 ? ', ' + WEEKDAYS[d.getDay()] : ''}`;
    const now = nowHM();
    const doses = dosesFor(date);
    const taken = doses.filter(x => x.at).length;

    let html = topBar() + `
      <div class="day">
        <button class="icon-btn" data-act="prev" aria-label="Предыдущий день">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>

        </button>
      </div>
      ${isToday ? '' : '<button class="back-today" data-act="today">Вернуться к сегодня</button>'}`;

    if (!data.pills.length) {
      html += `
        <div class="empty">
          <p>Список лекарств пока пуст.</p>
          <button class="btn btn-primary" data-act="add">+ Добавить лекарство</button>
        </div>`;
      app.innerHTML = html;
      return;
    }

    if (!doses.length) {
      html += `<div class="empty"><p>В этот день лекарства ещё не были добавлены.</p></div>` + bottomButtons();
      app.innerHTML = html;

    const allDone = taken === doses.length;
    html += `

      </div>`;

    let lastTime = null;
    for (const { p, t, at } of doses) {
      if (t !== lastTime) { html += `<div class="group-title">${t}</div>`; lastTime = t; }

      html += `
        <button class="dose ${cls}" data-dose="${esc(p.id)}" data-time="${t}" aria-pressed="${!!at}">
          <span class="info">
            <span class="name">${esc(p.name)}</span>
            ${p.dose || p.note ? `<span class="meta" style="display:block">${esc([p.dose, p.note].filter(Boolean).join(' · '))}</span>` : ''}
            <span class="state" style="display:block">${state}</span>
          </span>
          <span class="check" aria-hidden="true">${ICON_CHECK}</span>
        </button>`;
    }

    html += bottomButtons();
    app.innerHTML = html;
  }

  const bottomButtons = () => `
    <div class="manage bottom-btns">
      <button class="btn btn-ghost" data-act="calendar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        Календарь

      <button class="btn btn-ghost" data-act="manage">Мои лекарства</button>
    </div>`;

  function renderManage() {
    const pills = [...data.pills].sort((a, b) => a.name.localeCompare(b.name, 'ru'));
    let html = topBar() + `
      <div class="screen-head">
        <button class="icon-btn" data-act="back" aria-label="Назад">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h1>Мои лекарства</h1>
      </div>`;
    if (!pills.length) html += `<div class="empty"><p>Пока ничего не добавлено.</p></div>`;
    for (const p of pills) {
      html += `
        <button class="pill-row" data-edit="${esc(p.id)}">
          <span class="info">
            <span class="name" style="display:block;font-size:1.2rem;font-weight:700">${esc(p.name)}</span>
            <span class="meta" style="display:block;color:var(--muted)">${esc([p.dose, p.times.join(', ')].filter(Boolean).join(' · '))}</span>
          </span>
          <span class="chev" aria-hidden="true">›</span>
        </button>`;
    }
    html += `<div class="manage"><button class="btn btn-primary btn-block" data-act="add">+ Добавить лекарство</button></div>`;
    app.innerHTML = html;
  }

  function renderEdit() {
    const p = editing;
    const isNew = !data.pills.some(x => x.id === p.id);
    app.innerHTML = topBar() + `
      <div class="screen-head">
        <button class="icon-btn" data-act="cancel-edit" aria-label="Назад">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h1>${isNew ? 'Новое лекарство' : 'Изменить'}</h1>
      </div>
      <form id="pill-form" autocomplete="off">
        <label class="f" for="f-name">Название</label>
        <input class="in" id="f-name" value="${esc(p.name)}" placeholder="Аспирин" maxlength="80" required>

        <label class="f" for="f-dose">Сколько принимать <span class="hint">— необязательно</span></label>
        <input class="in" id="f-dose" value="${esc(p.dose)}" placeholder="1 таблетка" maxlength="80">

        <label class="f" for="f-note">Заметка <span class="hint">— необязательно</span></label>
        <input class="in" id="f-note" value="${esc(p.note)}" placeholder="После еды" maxlength="200">

        <label class="f">Время приёма</label>
        <div class="times" id="times">
          ${p.times.map((t, i) => `
            <div class="time-row">
              <input class="in" type="time" value="${t}" data-time-idx="${i}" aria-label="Время приёма ${i + 1}">
              ${p.times.length > 1 ? `<button type="button" class="icon-btn" data-del-time="${i}" aria-label="Убрать это время">✕</button>` : ''}
            </div>`).join('')}
        </div>
        <div class="presets">
          <button type="button" class="chip" data-add-time="">+ Ещё время</button>
          <button type="button" class="chip" data-add-time="08:00">Утро 8:00</button>
          <button type="button" class="chip" data-add-time="13:00">День 13:00</button>
          <button type="button" class="chip" data-add-time="20:00">Вечер 20:00</button>
        </div>

        <div class="error" id="form-error" role="alert"></div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-block">Сохранить</button>
          ${isNew ? '' : '<button type="button" class="btn btn-danger btn-block" data-act="delete">Удалить лекарство</button>'}
        </div>
      </form>`;
  }

  function render() {
    applyTheme();
    if (view === 'manage') renderManage();
    else if (view === 'edit') renderEdit();
    else if (view === 'calendar') renderCalendar();
    else if (view === 'remind') renderRemind();
    else renderToday();
  }

  // Сохраняем то, что введено в форму, в объект editing
  function syncForm() {
    if (view !== 'edit') return;
    const $ = id => document.getElementById(id);
    editing.name = $('f-name').value;
    editing.dose = $('f-dose').value;
    editing.note = $('f-note').value;
    editing.times = [...document.querySelectorAll('[data-time-idx]')].map(i => i.value);
  }

  function go(v) { view = v; render(); window.scrollTo(0, 0); }

  // ---------- События ----------
  app.addEventListener('click', async e => {
    const t = e.target.closest('button');
    if (!t) return;
    const act = t.dataset.act;

    if (t.dataset.themeSet) { theme = t.dataset.themeSet; syncForm(); render(); return; }

    if (t.dataset.dose) {
      const pillId = t.dataset.dose, time = t.dataset.time;
      const date = isoDate(dayDate());
      const already = (data.log[date] || {})[`${pillId}@${time}`];
      if (already) {
        const pill = data.pills.find(x => x.id === pillId);
        const ok = await confirmBox('Снять отметку?', `«${pill ? pill.name : ''}» в ${time} будет отмечено как не принятое.`, 'Да, снять отметку');
        if (!ok) return;
      }
      api('POST', '/api/toggle', { date, pillId, time, at: nowHM() }).catch(() => alert('Нет связи с компьютером. Проверьте Wi-Fi.'));
      return;
    }

    if (t.dataset.day) {
      const [yy, mm, dd] = t.dataset.day.split('-').map(Number);
      const today = new Date(); today.setHours(0, 0, 0, 0);
      offset = Math.round((new Date(yy, mm - 1, dd) - today) / 86400000);
      go('today');
      return;
    }

    if (t.dataset.edit) {
      editing = structuredClone(data.pills.find(x => x.id === t.dataset.edit));
      go('edit');
      return;
    }
    if (t.dataset.addTime !== undefined) {
      syncForm();
      editing.times.push(t.dataset.addTime || nowHM());
      renderEdit();
      const inputs = document.querySelectorAll('[data-time-idx]');
      inputs[inputs.length - 1]?.focus();
      return;
    }
    if (t.dataset.delTime !== undefined) {
      syncForm();
      editing.times.splice(Number(t.dataset.delTime), 1);
      renderEdit();
      return;
    }

    switch (act) {
      case 'toggle-font': showFont = !showFont; syncForm(); render(); break;
      case 'font-': fontIdx--; applyFont(); syncForm(); render(); break;
      case 'font+': fontIdx++; applyFont(); syncForm(); render(); break;
      case 'prev': offset--; render(); break;
      case 'next': if (offset < 1) { offset++; render(); } break;
      case 'today': offset = 0; render(); break;
      case 'manage': go('manage'); break;
      case 'remind': remindMsg = ''; remindOk = false; go('remind'); checkPush(); break;
      case 'push-on': remindAction(enablePush); break;
      case 'push-off': remindAction(disablePush); break;
      case 'push-test': remindAction(async () => { await testPush(); remindOk = true; remindMsg = 'Отправлено — уведомление придёт через несколько секунд'; }); break;
      case 'share-link': {
        const url = t.dataset.link;
        if (navigator.share) navigator.share({ title: 'Мои таблетки', text: 'Список лекарств', url }).catch(() => {});
        else navigator.clipboard?.writeText(url).then(() => { remindOk = true; remindMsg = 'Ссылка скопирована'; render(); }, () => prompt('Скопируйте ссылку:', url));
        break;
      }
      case 'calendar': { const d = dayDate(); calMonth = new Date(d.getFullYear(), d.getMonth(), 1); go('calendar'); break; }
      case 'cal-prev': calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); render(); break;
      case 'cal-next': calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); render(); break;
      case 'back': go('today'); break;
      case 'add':
        editing = { id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2), name: '', dose: '', note: '', times: ['09:00'], created: isoDate(new Date()) };
        go('edit');
        break;
      case 'cancel-edit': go('manage'); break;
      case 'delete': {
        const ok = await confirmBox('Удалить лекарство?', `«${editing.name}» исчезнет из списка.`, 'Да, удалить');
        if (!ok) return;
        try { await api('DELETE', '/api/pills/' + encodeURIComponent(editing.id)); go('manage'); }
        catch { alert('Нет связи с компьютером. Проверьте Wi-Fi.'); }
        break;
      }
    }
  });

  app.addEventListener('input', e => {
    if (e.target.id === 'font-range') { fontIdx = Number(e.target.value); applyFont(); }
  });

  app.addEventListener('submit', async e => {
    e.preventDefault();
    if (e.target.id === 'join-form') {
      const code = document.getElementById('join-code').value;
      remindAction(async () => {
        if (data.pills.length && !(await confirmBox('Подключить общий список?', 'Список лекарств на этом устройстве заменится общим.', 'Да, подключить'))) return;
        await join(code);
        remindOk = true; remindMsg = 'Готово: устройство подключено к общему списку';
      });
      return;
    }
    syncForm();
    const err = document.getElementById('form-error');
    const pill = { ...editing, name: editing.name.trim(), times: editing.times.filter(Boolean) };
    if (!pill.name) { err.textContent = 'Введите название лекарства'; document.getElementById('f-name').focus(); return; }
    if (!pill.times.length) { err.textContent = 'Укажите хотя бы одно время приёма'; return; }
    try { await api('POST', '/api/pills', pill); go('manage'); }
    catch (ex) { err.textContent = 'Не удалось сохранить: нет связи с компьютером'; }
  });

  // Перерисовка раз в минуту: «пора принять» и смена дня в полночь
  let lastDay = isoDate(new Date());
  setInterval(() => {
    const today = isoDate(new Date());
    if (today !== lastDay) { lastDay = today; offset = 0; }
    if (view === 'today') render();
  }, 60000);

  applyFont();
  applyTheme();
  render();
  if (CLOUD) {
    // Работа без интернета и напоминания
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(checkPush, () => {});
    else checkPush();
    // Ссылка вида …#k=XXXX-XXXX-XXXX подключает устройство к общему списку
    const openLink = async () => {
      const m = location.hash.match(/k=([A-Za-z0-9-]{12,16})/);
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
      if (!m || m[1].toUpperCase() === hkey) return sync();
      if (data.pills.length && !(await confirmBox('Подключить общий список?', 'Список лекарств на этом устройстве заменится общим.', 'Да, подключить'))) return sync();
      try { await join(m[1]); offset = 0; go('today'); }
      catch (e) { alert(e.message); sync(); }
    };
    addEventListener('hashchange', openLink);
    openLink();
    // Нажатие на напоминание открывает сегодняшний день
    navigator.serviceWorker?.addEventListener('message', e => { if (e.data === 'open-today') { offset = 0; go('today'); sync(); } });
  } else {
    api('GET', '/api/state').catch(() => render());
    connect();
  }
})();
</script>
</body>
</html>
